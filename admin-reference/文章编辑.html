<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章编辑 · 后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://npm.elemecdn.com/lxgw-wenkai-screen-webfont@1.1.0/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../assets/css/shared.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <style>
        .mobile-header-fix { display: flex !important; }
        @media (min-width: 768px) { .mobile-header-fix { display: none !important; } }
        .path-badge { background: rgba(74,107,101,0.08); color: #4a6b65; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-family: var(--font-hand); }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: white; border: 1px solid #dcd3b2; border-radius: 4px; }
    </style>
</head>
<body class="is-admin">
    <div class="reading-progress"></div>
    <button id="back-to-top" class="back-to-top"><i class="ph ph-arrow-up"></i></button>
    <div class="book-container book-shadow">
        
        <header class="mobile-header-fix md:hidden flex items-center justify-between p-4 bg-[#2c2a29] text-[#dcd3b2] shadow-md relative z-30 shrink-0">
            <button onclick="toggleMobileMenu()" class="p-1 focus:outline-none"><i class="ph ph-list text-2xl"></i></button>
            <h1 class="font-calligraphy text-2xl tracking-widest absolute left-1/2 -translate-x-1/2 mt-1">后台管理</h1>
            <button onclick="location.href='../pages/首页.html'" class="w-7 h-7 border border-[#bfa57d] text-[#bfa57d] bg-[#bfa57d]/10 flex items-center justify-center text-[10px] font-bold focus:outline-none transition-colors" title="返回前台">返</button>
        </header>

        <div id="mobile-backdrop" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/60 z-40 hidden opacity-0 transition-opacity duration-300 md:hidden"></div>

        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-[240px] shrink-0 bg-[#2c2a29] text-gray-300 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-2xl md:shadow-none">
            <button class="md:hidden absolute top-5 right-5 text-gray-400 hover:text-white" onclick="toggleMobileMenu()">
                <i class="ph ph-x text-2xl"></i>
            </button>
            <div class="sidebar-top">
                <div class="flex items-center justify-center md:justify-between w-full mb-3">
                    <h1 class="font-calligraphy text-3xl text-[#e8e8e8] opacity-90 drop-shadow-md tracking-widest">后台管理</h1>
                    <button onclick="location.href='../pages/首页.html'" class="seal-btn seal-btn-return hidden md:flex" title="返回前台">返</button>
                </div>
                <p class="mt-3 text-xs text-[#a8a8a8] tracking-[0.4em] font-hand opacity-90 hidden md:block">内容管理 · 系统配置</p>
                <p class="mt-3 text-[10px] text-gray-500 tracking-[0.3em] uppercase font-serif opacity-50 w-full text-center border-t border-gray-700/30 pt-2 hidden md:block">Admin Panel</p>
            </div>
            <nav class="flex-1 py-6 px-5 overflow-y-auto">
                <ul class="space-y-2">
                    <li><a href="仪表盘.html" class="nav-link"><i class="ph ph-gauge"></i><span class="menu-item-text">管理仪表盘</span></a></li>
                    <li><a href="文章管理.html" class="nav-link active"><i class="ph ph-pen-nib"></i><span class="menu-item-text">文章管理</span></a></li>
                    <li><a href="相册管理.html" class="nav-link"><i class="ph ph-image"></i><span class="menu-item-text">相册管理</span></a></li>
                    <li><a href="网盘管理.html" class="nav-link"><i class="ph ph-hard-drives"></i><span class="menu-item-text">网盘管理</span></a></li>
                    <li><a href="导航管理.html" class="nav-link"><i class="ph ph-compass"></i><span class="menu-item-text">导航管理</span></a></li>
                    <li><a href="留言管理.html" class="nav-link"><i class="ph ph-envelope-simple"></i><span class="menu-item-text">留言管理</span></a></li>
                    <li><a href="设置.html" class="nav-link"><i class="ph ph-gear"></i><span class="menu-item-text">系统设置</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer"><p>&copy; 2024 - 2064</p><p class="mt-1 font-serif opacity-70">朝花夕拾 · 岁月静好</p></div>
        </aside>
        <div class="sidebar-overlay"></div>
        <main class="content paper-texture">
            <header class="flex justify-between items-end border-b border-[#dcd3b2] pb-4 mb-6">
                <div>
                    <h2 class="text-3xl font-bold text-[#2c2c2c] mb-1 font-serif">编辑文章</h2>
                    <p class="text-[#8b3a3a] text-sm font-serif">文字存 D1 · 附件自动存入 OpenList 日期目录</p>
                </div>
                <div class="flex gap-2">
                    <a href="文章管理.html" class="btn btn-outline"><i class="ph ph-arrow-left"></i> 返回</a>
                    <button class="btn btn-primary" onclick="saveDraft()"><i class="ph ph-floppy-disk"></i> 保存草稿</button>
                </div>
            </header>

            <!-- 文章标题编辑框 -->
            <div class="mb-6">
                <div class="form-group">
                    <label>文章标题</label>
                    <input type="text" class="form-input" value="三十岁的第一个清晨" placeholder="请输入标题">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="form-group">
                    <label>分类</label>
                    <select class="form-input">
                        <option>随笔</option>
                        <option>技术</option>
                        <option>游记</option>
                        <option>摄影</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>权限</label>
                    <select class="form-input" id="permission-select" onchange="togglePasswordField()">
                        <option value="public">公开</option>
                        <option value="encrypted">加密</option>
                        <option value="private">私有</option>
                    </select>
                </div>
                <div class="form-group" id="password-input-group" style="display: none;">
                    <label>加密密码</label>
                    <input type="text" class="form-input" id="password-input" placeholder="请输入文章密码">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="form-group">
                    <label>发布日期</label>
                    <input type="date" class="form-input" value="2024-05-20">
                </div>
                <div class="form-group">
                    <label>天气</label>
                    <input type="text" class="form-input" placeholder="如：晴" value="晴">
                </div>
                <div class="form-group">
                    <label>心情</label>
                    <input type="text" class="form-input" placeholder="如：宁" value="宁">
                </div>
            </div>

            <!-- 编辑器 -->
            <div class="editor-toolbar">
                <button class="btn" onclick="showToast('粗体')"><b>B</b></button>
                <button class="btn" onclick="showToast('斜体')"><i>I</i></button>
                <button class="btn" onclick="showToast('引用')">❝</button>
                <button class="btn" onclick="showToast('图片')">🖼️</button>
                <button class="btn" onclick="showToast('链接')">🔗</button>
            </div>
            <div class="editor-body">
                <textarea placeholder="开始书写..." style="min-height: 400px;">今天阳光很好，透过窗帘照在书桌上。我想是时候整理一下过去十年的照片了...

时光匆匆，三十岁就这么来了。没有想象中的波澜壮阔，只有一种平静的力量。把这些年拍的照片整理了一下，选了一些放入相册。</textarea>
            </div>

            <!-- 附件上传区域 -->
            <div class="stat-card mt-6">
                <h4 class="font-serif font-bold text-sm mb-3">文章附件</h4>
                <div class="mb-3 space-y-2">
                    <div class="file-item">
                        <div class="flex items-center gap-2">
                            <i class="ph ph-file-pdf text-[#bfa57d] text-xl"></i>
                            <span>notes.pdf</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[#999] text-sm font-hand">856 KB</span>
                            <button class="btn btn-outline btn-sm" onclick="showToast('下载中...')"><i class="ph ph-download-simple"></i></button>
                            <button class="btn btn-danger btn-sm" onclick="showToast('已从列表移除，文件保留在 OpenList')"><i class="ph ph-x"></i></button>
                        </div>
                    </div>
                </div>
                <div class="upload-zone border-2 border-dashed border-[#dcd3b2] rounded p-4 text-center cursor-pointer hover:border-[#8b3a3a] hover:bg-[rgba(139,58,58,0.02)]" onclick="showToast('选择文件上传')">
                    <div class="upload-icon"><i class="ph ph-cloud-arrow-up text-2xl text-[#bfa57d]"></i></div>
                    <div class="upload-text text-sm">点击或拖拽上传附件 · 自动存入日期目录</div>
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-4">
                <a href="文章管理.html" class="btn btn-outline">取消</a>
                <button class="btn btn-primary" onclick="publishArticle()"><i class="ph ph-paper-plane-tilt"></i> 发布</button>
            </div>
        </main>
    </div>
    <script src="../assets/js/shared.js"></script>
    <script>
    const sidebar=document.getElementById('sidebar');const backdrop=document.getElementById('mobile-backdrop');
    function toggleMobileMenu(){const isClosed=sidebar.classList.contains('-translate-x-full');if(isClosed){backdrop.classList.remove('hidden');setTimeout(()=>backdrop.classList.remove('opacity-0'),10);sidebar.classList.remove('-translate-x-full')}else{backdrop.classList.add('opacity-0');sidebar.classList.add('-translate-x-full');setTimeout(()=>backdrop.classList.add('hidden'),300)}}
    function saveDraft() {
            showToast('文章已保存到 D1');
        }
        function publishArticle() {
            showToast('文章已发布');
        }
        function togglePasswordField() {
            const select = document.getElementById('permission-select');
            const passwordInputGroup = document.getElementById('password-input-group');
            if (select.value === 'encrypted') {
                passwordInputGroup.style.display = 'block';
            } else {
                passwordInputGroup.style.display = 'none';
            }
        }
    </script>
</body>
</html>
